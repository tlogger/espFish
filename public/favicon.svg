<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="exfish-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="exfish-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Material Rounded App Icon Container -->
  <rect width="128" height="128" rx="28" fill="url(#exfish-bg)" />
  <rect width="120" height="120" x="4" y="4" rx="24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  
  <!-- Material Waves at Bottom -->
  <path d="M14 96 Q32 86 50 96 T86 96 T114 96 L114 114 Q100 114 86 114 T50 114 T14 114 Z" fill="rgba(255,255,255,0.12)" />
  <path d="M14 104 Q32 94 50 104 T86 104 T114 104 L114 114 Q100 114 86 114 T50 114 T14 114 Z" fill="rgba(255,255,255,0.18)" />

  <!-- Material Stylized Leaping Fish & Hook Motif -->
  <g filter="url(#shadow)">
    <!-- Hook Curve -->
    <path d="M72 26 C84 26 94 36 94 48 C94 62 82 74 66 74 C54 74 46 66 46 56 C46 50 50 46 54 46 C58 46 62 50 62 55 C62 58 60 60 57 60 C59 63 62 65 66 65 C76 65 84 57 84 48 C84 39 77 34 68 34 C63 34 58 37 54 41 L50 36 C55 30 63 26 72 26 Z" fill="#FFFFFF" />
    <!-- Fishing Float / Bobber Top Indicator -->
    <circle cx="72" cy="22" r="5" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Modern Dynamic Fish Outline -->
    <path d="M30 64 C42 46 70 42 88 56 C74 72 48 76 30 64 Z" fill="url(#exfish-accent)" />
    <!-- Fish Tail -->
    <polygon points="26,54 34,64 24,72" fill="#38BDF8" />
    <!-- Eye -->
    <circle cx="76" cy="54" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
